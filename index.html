<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Control de Inventario</title><style>
:root{--c1:#0f4c5c;--c2:#e36414;--bg:#f4f6f7;--tx:#1b2a30;--mu:#6b7b82;--ok:#2a9d5c;--wa:#e9a100;--er:#d1495b;--bd:#dde4e7}
*{box-sizing:border-box}body{margin:0;font:16px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--tx)}
.top{background:var(--c1);color:#fff;display:flex;align-items:center;gap:10px;padding:12px 16px;position:sticky;top:0;z-index:5}.top b{flex:1}
.tb{background:#ffffff26;color:#fff;border:0;border-radius:10px;padding:8px 12px;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:16px}.wrap.adm{max-width:1100px}.c{text-align:center;padding-top:30px}
.card{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:16px;margin:0 0 12px}
.btn{display:block;width:100%;background:var(--c1);color:#fff;border:0;border-radius:16px;padding:18px;font-size:19px;font-weight:600;margin:0 0 12px;cursor:pointer}
.btn small{display:block;font-weight:400;font-size:13px;opacity:.85}.btn.alt{background:var(--c2)}.btn.g{background:#fff;color:var(--c1);border:2px solid var(--c1)}.btn.ok{background:var(--ok)}
.btn.s{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0 6px 6px 0;border-radius:10px}.btn:disabled{opacity:.4}
.mu{color:var(--mu)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:2px solid var(--bd);background:#fff;border-radius:999px;padding:12px 18px;font-size:17px}.chip.on{background:var(--c1);color:#fff;border-color:var(--c1)}
input,select,textarea{width:100%;font:inherit;padding:12px;border:2px solid var(--bd);border-radius:12px;background:#fff;margin:4px 0 10px}
.q{display:flex;align-items:center;gap:8px;margin-bottom:6px}.q button{width:56px;height:56px;border-radius:14px;border:0;background:var(--c1);color:#fff;font-size:30px}.q input{flex:1;text-align:center;font-size:24px;margin:0}
.tot{font-size:22px;font-weight:700;color:var(--c1);border-top:1px dashed var(--bd);padding-top:8px;margin-top:8px}
.bar{height:12px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
.nav{display:flex;overflow:auto;gap:6px;padding:8px 16px;background:#fff;border-bottom:1px solid var(--bd)}.nav button{white-space:nowrap;border:0;background:none;padding:8px 12px;border-radius:10px;font-size:15px}.nav .on{background:var(--c1);color:#fff}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.n{font-size:34px;font-weight:700;color:var(--c1)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.tag{border-radius:8px;padding:2px 8px;font-size:12px;color:#fff;background:var(--mu);white-space:nowrap}.t1{background:var(--ok)}.t2{background:var(--wa)}.t3{background:var(--er)}
.dh{cursor:grab;touch-action:none;user-select:none}.dh:active{cursor:grabbing}.dragging{opacity:.4}
.mnu{position:relative;display:inline-block}.dots{background:none;border:0;font-size:22px;line-height:1;padding:2px 10px;border-radius:8px;color:var(--mu);cursor:pointer}.dots:hover{background:var(--bg)}.dd{position:absolute;right:0;top:110%;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 6px 18px #0002;z-index:6;min-width:170px;overflow:hidden;text-align:left}.dd button{display:block;width:100%;text-align:left;background:none;border:0;padding:11px 14px;font-size:14px;border-radius:0}.dd button:hover{background:var(--bg)}
.ov{position:fixed;inset:0;background:#0008;display:flex;align-items:center;justify-content:center;padding:14px;z-index:9}.md{background:#fff;border-radius:18px;padding:18px;width:100%;max-width:480px;max-height:92vh;overflow:auto}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}.row .btn{width:48%}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1b2a30;color:#fff;padding:12px 20px;border-radius:12px;opacity:0;transition:.3s;z-index:20}
@media print{.top,.nav,.np{display:none!important}body{background:#fff}.card{border:0}}
.wrap.wide{max-width:960px}@media(min-width:800px){.cg{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;align-items:start}.wrap{padding:24px 16px}}
</style></head><body><div id="app"></div><div id="toast"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
// ===== EDITÁ ACÁ: valores por defecto (también se cambian desde Admin → Configuración) =====
const BRAND={hotel:"Hotel Demo",c1:"#0f4c5c",c2:"#e36414"};
const TURNOS=[["Mañana","🌅"],["Tarde","☀️"],["Noche","🌙"]],SK="ci_v2";
const $=s=>document.querySelector(s),nid=()=>Math.random().toString(36).slice(2,9),pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()),today=()=>ymd(new Date()),hm=()=>{const d=new Date();return pad(d.getHours())+":"+pad(d.getMinutes())};
const turnoAuto=()=>{const h=new Date().getHours();return h>=6&&h<12?"Mañana":h>=12&&h<18?"Tarde":"Noche"};// EDITÁ ACÁ los horarios: Mañana 6–11:59, Tarde 12–17:59, Noche 18–5:59
const fd=s=>s.split("-").reverse().join("/"),esc=s=>String(s).replace(/[&<>"]/g,c=>"&#"+c.charCodeAt(0)+";");
const EMPTY=()=>({cfg:{...BRAND},units:["C/U","L","ml","botella","lata","caja","pack"],cats:[],locs:[],users:[],prods:[],counts:[],moves:[],audit:[]});
let D=EMPTY(),S={v:"login"},ADMIN_EXISTS=null;
function enter(uid,me){D.users=[me];S.u=uid;S.v=adm()?"dash":"home";S.msg="";R()}
function reset_(m){D=EMPTY();S={v:"login",msg:m||""};R()}
const save=()=>{window.FBs&&window.FBs()};
const P=i=>D.prods.find(x=>x.id==i),C=i=>D.cats.find(x=>x.id==i),L=i=>D.locs.find(x=>x.id==i),U=i=>D.users.find(x=>x.id==i),un=i=>U(i)?U(i).n+" "+U(i).ap:"—";
const log=t=>{D.audit.unshift({id:nid(),ts:today()+" "+hm(),u:S.u,t});save()},adm=()=>S.u&&U(S.u)?.rol=="ADMINISTRADOR";
const CC=()=>D.counts.filter(c=>c.st!="curso").sort((a,b)=>a.closedAt<b.closedAt?-1:1),K=()=>D.counts.find(c=>c.id==S.cid);
const tot=(c,i)=>Object.values(c.data[i]||{}).reduce((a,b)=>a+b,0),cnt=(c,i)=>Object.keys(c.data[i]||{}).length;
const prev=c=>CC().filter(k=>k.id!=c.id&&k.closedAt<(c.closedAt||c.fecha+" "+c.ini)).pop();
function stock(id){const k=CC().pop();if(!k)return 0;let s=tot(k,id);D.moves.forEach(m=>{if(m.pid==id&&(m.ts>=k.closedAt||m.cid==k.id))s+=m.t=="entrada"||m.t=="late"?m.q:m.t=="traslado"?0:-m.q});return Math.max(0,s)}
const alerts=()=>!CC().length?[]:D.prods.filter(p=>p.a).map(p=>({p,s:stock(p.id)})).filter(x=>x.s<x.p.min);
const ac=()=>D.cats.filter(c=>c.a&&D.prods.some(p=>p.a&&p.cat==c.id));
const al=()=>D.locs.filter(l=>l.a&&D.prods.some(p=>p.a&&p.locs.includes(l.id)));
const IC={entrada:"📦",salida:"📤",traslado:"🔄",merma:"⚠️",late:"🕒"};
const mtxt=m=>{const p=P(m.pid)||{n:"?",u:""};return`${IC[m.t]} <b>${p.n}</b> · ${m.t=="entrada"||m.t=="late"?"+":m.t=="traslado"?"":"−"}${m.q} ${p.u} · ${L(m.loc)?.n||""}${m.to?" → "+L(m.to).n:""}${m.motivo?" · "+m.motivo:""}${m.obs?" · “"+esc(m.obs)+"”":""} · ${un(m.uid)} · ${fd(m.ts.slice(0,10))} ${m.ts.slice(11)}`};
function dots(key,acts){const open=S.om===key;return`<span class=mnu><button class=dots onclick="A.tm('${key}')">⋮</button>${open?`<div class=dd>${acts.map(a=>`<button onclick="S.om=null;${a[1]}">${a[0]}</button>`).join("")}</div>`:""}</span>`}
const stag=c=>({ok:'<span class="tag t1">✅ Completado</span>',obs:'<span class="tag t3">🔴 Con observaciones</span>',curso:'<span class="tag t2">🟡 En curso</span>'})[c.st];
const cRow=c=>`<div class="card row" style="cursor:pointer" onclick="A.rep('${c.id}')"><span><b>${fd(c.fecha)} · Turno ${c.turno}</b><br><span class=mu>${un(c.uid)} · ${c.ini}–${c.fin||"…"}</span></span>${stag(c)}</div>`;
function T(m){const e=$("#toast");e.textContent=m;e.style.opacity=1;setTimeout(()=>e.style.opacity=0,2000)}
function th(){const r=document.documentElement.style;r.setProperty("--c1",D.cfg.c1);r.setProperty("--c2",D.cfg.c2);document.title=D.cfg.hotel+" · Control de Inventario"}
const shell=(b,back)=>`<div class=top>${back?`<button class=tb onclick="A.go('${back}')">←</button>`:""}<b>${D.cfg.hotel}</b><button class=tb onclick="A.out()">Salir</button></div><div class="wrap ${S.v=="count"?"wide":""}">${b}</div>`;
const TABS=[["dash","🏠 Inicio"],["prods","📦 Productos"],["cats","🏷️ Categorías"],["locs","📍 Ubicaciones"],["users","👥 Usuarios"],["counts","📋 Conteos"],["movs","🔄 Movimientos"],["reps","📄 Reportes"],["cfg","⚙️ Configuración"]];
const ash=b=>`<div class=top><b>${D.cfg.hotel} · Administrador</b><button class=tb title="Configuración" onclick="A.go('cfg')">⚙️</button><button class=tb onclick="A.out()">Salir</button></div><div class=nav>${TABS.map(t=>`<button class="${S.v==t[0]?"on":""}" onclick="A.go('${t[0]}')">${t[1]}</button>`).join("")}</div><div class="wrap adm">${b}</div>`;
// ---------- reporte ----------
function rep(k,ad){const pv=prev(k),ms=D.moves.filter(m=>(m.ts>=k.fecha+" "+k.ini&&m.ts<=(k.closedAt||"9"))||m.cid==k.id),late=ms.filter(m=>m.cid==k.id),oth=ms.filter(m=>m.cid!=k.id);
return`<div class=card><div class=row><h2 style="margin:0">${D.cfg.hotel}</h2><button class="btn s np" onclick="print()">⬇️ DESCARGAR PDF</button></div>
<p>Conteo de inventario · <b>${fd(k.fecha)}</b> · Turno ${k.turno} · ${k.ini}–${k.fin||"en curso"}<br>Funcionarios: ${k.staff.map(un).join(", ")}<br>Responsable: ${un(k.uid)} · Cierre: ${k.closedAt?fd(k.closedAt.slice(0,10))+" "+k.closedAt.slice(11):"—"}</p>
<div style="overflow-x:auto"><table><tr><th>Producto</th><th>Ubicaciones</th><th>Total</th><th>Inicio</th><th>Venta teórica</th></tr>${D.cats.map(c=>{const ps=D.prods.filter(p=>p.cat==c.id&&cnt(k,p.id));return ps.length?`<tr><th colspan=5>${c.i} ${c.n}</th></tr>`+ps.map(p=>{const t=tot(k,p.id),i=pv?tot(pv,p.id):null;return`<tr><td>${p.n}</td><td>${Object.entries(k.data[p.id]).map(([l,q])=>`${L(l)?.n}: ${ad&&k.st!="curso"?`<a href="#" onclick="A.fix('${k.id}','${p.id}','${l}');return false">${q}</a>`:q}`).join("<br>")}</td><td><b>${t} ${p.u}</b></td><td>${i==null?"—":i+" "+p.u}</td><td>${i==null?"—":i-t+" "+p.u}</td></tr>`}).join(""):""}).join("")}</table></div>
<p class=mu>Venta teórica = stock inicial − stock final (conteo anterior).${ad?" Tocá una cantidad para corregirla (queda registrado).":""}</p>
${late.length?"<h3>Recibidos después del conteo</h3>"+late.map(m=>`<div>${mtxt(m)} · hora ${m.h}</div>`).join(""):""}
${oth.length?"<h3>Movimientos</h3>"+oth.map(m=>`<div>${mtxt(m)}</div>`).join(""):""}
${k.cash?"<h3>💵 Recuento de efectivo</h3>"+Object.entries(k.cash).map(([x,v])=>`<div>${x.toUpperCase()}: inicio $${+v.i} · cierre $${+v.c} · responsable ${un(v.r)}</div>`).join(""):""}
${k.obs?`<h3>Observaciones</h3><p>${esc(k.obs)}</p>`:""}</div>`}
// ---------- modal ----------
const modal=()=>{const m=S.M;return`<div class=ov><div class=md><h2>${m.title}</h2>${m.fs.map(f=>`<label><b>${f.l}</b></label>`+(f.t=="s"?`<select name=${f.k}>${f.o.map(x=>`<option value="${x[0]}" ${x[0]==f.v?"selected":""}>${x[1]}</option>`).join("")}</select>`:f.t=="c"?`<br><input type=checkbox name=${f.k} style="width:26px;height:26px" ${f.v?"checked":""}><br>`:f.t=="m"?f.o.map(x=>`<label style="display:block;padding:4px 0"><input type=checkbox name=${f.k} value="${x[0]}" style="width:22px;height:22px;vertical-align:middle;margin:0 8px 0 0" ${f.v.includes(x[0])?"checked":""}>${x[1]}</label>`).join(""):`<input name=${f.k} type=${f.t=="n"?"number":"text"} value="${String(f.v??"").replace(/"/g,"&quot;")}">`)).join("")}<div class=row style="margin-top:10px"><button class="btn g" onclick="S.M=null;R()">Cancelar</button><button class=btn onclick="A.ok()">GUARDAR</button></div></div></div>`};
function M(title,fs,ok){S.M={title,fs,ok};R()}
// ---------- vistas colaborador ----------
const V={
login:()=>{const m=S.lm||"pin";return`<div class="wrap c"><div style="font-size:60px">🏨</div><h1>${D.cfg.hotel}</h1><p class=mu>Control de Inventario<br>Conteo y control de insumos</p><div class=chips style="justify-content:center;margin-bottom:12px"><button class="chip ${m=="pin"?"on":""}" onclick="S.lm='pin';R()">👤 Colaborador</button><button class="chip ${m=="adm"?"on":""}" onclick="S.lm='adm';R()">🛠️ Administrador</button></div><div class=card style="text-align:left">${m=="pin"?`Usuario<input id=lu autocapitalize=none autocomplete=username placeholder="Ej: maria">PIN<input id=lp type=password inputmode=numeric autocomplete=current-password placeholder="••••">`:`Correo<input id=lu type=email autocomplete=username placeholder="tu@correo.com">Contraseña<input id=lp type=password autocomplete=current-password>`}<button class=btn onclick="A.login()">ENTRAR</button>${m=="adm"&&ADMIN_EXISTS===false?`<button class="btn g" onclick="A.reg()">Primera vez: crear cuenta de administrador</button>`:""}</div><p id=lerr style="color:var(--er)">${S.msg||""}</p></div>`},
home:()=>{const u=U(S.u),k=D.counts.find(c=>c.st=="curso");return shell(`<h1>Hola, ${u.n} 👋</h1><p class=mu>¿Qué querés hacer?</p>${k?`<button class="btn alt" onclick="A.resume('${k.id}')">▶️ CONTINUAR CONTEO<small>Turno ${k.turno} · iniciado por ${un(k.uid)} a las ${k.ini}</small></button>`:`<button class="btn ok" onclick="A.start()">🟢 INICIAR CONTEO</button>`}<button class=btn onclick="A.mov('entrada')">📦 REGISTRAR ENTRADA</button><button class=btn onclick="A.mov('salida')">📤 REGISTRAR SALIDA</button><button class=btn onclick="A.go('search')">🔎 BUSCAR PRODUCTO</button><button class=btn onclick="A.go('mine')">📋 CONTEOS</button>`)},
start:()=>shell(`<h2>Nuevo conteo</h2><div class=card>📅 Fecha: <b>${fd(today())}</b><br>${TURNOS.find(t=>t[0]==turnoAuto())[1]} Turno: <b>${turnoAuto()}</b><br>🕒 Hora de inicio: <b>${hm()}</b><br><span class=mu>Se detectan solos.</span></div><h3>Funcionarios en turno</h3><div class=chips>${D.users.filter(u=>u.a&&u.rol=="COLABORADOR").map(u=>`<button class="chip ${S.f.staff.includes(u.id)?"on":""}" onclick="A.tg('${u.id}')">${u.n} ${u.ap}</button>`).join("")}</div><br><button class="btn ok" onclick="A.begin()">COMENZAR CONTEO</button>`,"home"),
count:()=>{const k=K(),ls=al(),l=ls[S.ci],ps=D.prods.filter(p=>p.a&&p.locs.includes(l.id)),all=D.prods.filter(p=>p.a),
tp=all.reduce((a,p)=>a+p.locs.filter(x=>L(x)&&L(x).a).length,0),fp=all.reduce((a,p)=>a+p.locs.filter(x=>L(x)&&L(x).a&&k.data[p.id]&&k.data[p.id][x]!==undefined).length,0),
pct=tp?Math.round(fp/tp*100):100,last=S.ci==ls.length-1;
return shell(`<div class=mu>CONTEO · Turno ${k.turno}</div><div class=bar><i style="width:${pct}%"></i></div><b>${pct}%</b><h2>📍 ${l.n.toUpperCase()}</h2><p class=mu>${ps.length} productos · ubicación ${S.ci+1} de ${ls.length}</p><div class=cg>${ps.map(p=>`<div class=card><b>${C(p.cat)?.i||"📦"} ${p.n}</b><div class=mu>Unidad: ${p.u}</div><div class=q><button onclick="A.st('${p.id}','${l.id}',-1)">−</button><input id="i-${p.id}-${l.id}" type=number inputmode=${["L","ml"].includes(p.u)?"decimal":"numeric"} enterkeyhint=next min=0 placeholder=0 value="${k.data[p.id]?.[l.id]??""}" onfocus="this.select()" oninput="A.live('${p.id}')" onchange="A.set('${p.id}','${l.id}',this.value)" onkeydown="if(event.key=='Enter'){event.preventDefault();A.nx(this)}"><button onclick="A.st('${p.id}','${l.id}',1)">+</button></div></div>`).join("")}</div><div class=row><button class="btn g" onclick="A.pg(-1)" ${S.ci?"":"disabled"}>← Anterior</button><button class=btn onclick="A.pg(1)">${last?"REVISAR CONTEO":"SIGUIENTE →"}</button></div><button class="btn g" onclick="A.preview()">👁️ Ver conteo hasta ahora</button><button class="btn g" onclick="A.mov('entrada')">🔄 Registrar un movimiento</button>`,"home")},
review:()=>{const k=K(),ls=al(),ps=D.prods.filter(p=>p.a),tp=ps.reduce((a,p)=>a+p.locs.filter(x=>L(x)&&L(x).a).length,0),fp=ps.reduce((a,p)=>a+p.locs.filter(x=>L(x)&&L(x).a&&k.data[p.id]&&k.data[p.id][x]!==undefined).length,0),miss=tp-fp;return shell(`<h2>Revisá tu conteo antes de enviarlo</h2>${miss?`<div class=card style="border-color:var(--wa)">⚠️ Faltan ${miss} conteos por completar.</div>`:""}${ls.map(l=>`<div class=card><b>📍 ${l.n}</b>${ps.filter(p=>p.locs.includes(l.id)).map(p=>`<div class=row><span>${p.n}</span><b>${k.data[p.id]&&k.data[p.id][l.id]!==undefined?k.data[p.id][l.id]+" "+p.u:"⚠️ —"}</b></div>`).join("")}</div>`).join("")}<div class=row><button class="btn g" onclick="A.backFromReview()">${S.prevCi!=null?"SEGUIR CONTANDO":"EDITAR"}</button><button class="btn ok" onclick="A.toClose()">CONFIRMAR Y FINALIZAR</button></div>`,"count")},
close:()=>{const k=K(),f=S.cl,late=D.moves.filter(m=>m.cid==k.id);return shell(`<h2>Cerrar conteo</h2><div class=card>🕒 Hora de cierre: <b>${hm()}</b> <span class=mu>(se registra sola al cerrar)</span></div><button class="btn g" onclick="A.mov('late')">+ REGISTRAR PRODUCTO RECIBIDO DESPUÉS DEL CONTEO</button>${late.map(m=>`<div class=card>${mtxt(m)}</div>`).join("")}<label class=card style="display:block"><input type=checkbox style="width:24px;height:24px;vertical-align:middle;margin:0 8px 0 0" ${f.cash?"checked":""} onchange="S.cl.cash=this.checked;R()">💵 Recuento de efectivo (opcional)</label>${f.cash?["recova","casino"].map(x=>`<div class=card><b>${x.toUpperCase()}</b><br>Inicio $<input type=number value="${f.cs[x].i}" onchange="S.cl.cs.${x}.i=this.value">Cierre $<input type=number value="${f.cs[x].c}" onchange="S.cl.cs.${x}.c=this.value">Funcionario responsable<select onchange="S.cl.cs.${x}.r=this.value">${D.users.filter(u=>u.a).map(u=>`<option value=${u.id} ${u.id==f.cs[x].r?"selected":""}>${u.n} ${u.ap}</option>`).join("")}</select></div>`).join(""):""}<h3>¿Querés agregar una observación?</h3><textarea rows=4 placeholder="Ej: Se recibió mercadería después del conteo." onchange="S.cl.obs=this.value">${esc(f.obs||"")}</textarea><button class="btn ok" onclick="A.fin()">CERRAR CONTEO</button>`,"review")},
done:()=>{const k=K(),pv=prev(k),ps=D.prods.filter(p=>p.a&&cnt(k,p.id)),ms=D.moves.filter(m=>(m.ts>=k.fecha+" "+k.ini&&m.ts<=k.closedAt)||m.cid==k.id);return shell(`<div class=c><div style="font-size:56px">✅</div><h2>CONTEO FINALIZADO</h2></div><div class=card>Productos contados: <b>${ps.length}</b><br>Movimientos registrados: <b>${ms.length}</b></div>${ps.map(p=>`<div class=card><b>${p.n}</b><br>Inicio: ${pv?tot(pv,p.id)+" "+p.u:"—"}<br>Cierre: ${tot(k,p.id)} ${p.u}</div>`).join("")}<button class=btn onclick="A.rep('${k.id}')">📄 VER REPORTE</button><button class="btn g" onclick="A.go('home')">Volver al inicio</button>`)},

function ps(txt){txt=txt.replace(/^\uFEFF/,"");const raw=[],errs=[];txt.split(/\r?\n/).filter(l=>l.trim()).forEach((l,i)=>{const sep=l.includes(";")?";":l.includes("\t")?"\t":",",c=l.split(sep).map(x=>x.trim().replace(/["\u201c\u201d\u2018\u2019]/g,"").trim());if(i==0&&/^productos?$/i.test(c[0]))return;if(!c.slice(0,5).some(Boolean))return;const m=[];if(!c[0])m.push("Producto");if(!c[1])m.push("Categoría");if(!c[2])m.push("Unidad");const minv=parseFloat(String(c[3]??"").replace(",","."));if(c[3]===undefined||c[3]===""||isNaN(minv))m.push("Stock mínimo");if(!c[4])m.push("Ubicación");if(m.length){errs.push(`Fila ${i+1} (${c[0]||"sin nombre"}): falta ${m.join(", ")}`);return}raw.push({n:c[0],cat:c[1],u:c[2],min:minv,locs:c[4].split(/[\/|]/).map(x=>x.trim()).filter(Boolean),a:!/^(inactivo|no|0)$/i.test(c[5]||"")})});
